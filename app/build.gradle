plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.codex.ricohfullzoom'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.codex.ricohfullzoom'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }

    // Keep the shipped file name aligned with the launcher label.
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "理光模式全焦段-${variant.versionName}.apk"
        }
    }
}

dependencies {
    // Supplied by LSPosed/Xposed at runtime; do not package these bridge classes.
    compileOnly 'de.robv.android.xposed:api:82'
}
